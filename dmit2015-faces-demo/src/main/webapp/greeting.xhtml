<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">
<h:head>
    <title>DMIT2015 Greeting</title>
</h:head>
<h:body>
    <h1>DMIT2015 Greeting</h1>

    <h:form>
        <p:messages />

        <p:outputLabel for="firstName" value="First name: " />
        <p:inputText id="firstName"
                     value="#{greetingBean.firstName}" />

        <p:outputLabel for="lastName" value="Last name: " />
        <p:inputText id="lastName"
                     value="#{greetingBean.lastName}" />

        <p:commandButton value="Submit" ajax="false" />

        <p>
            <h:outputText value="#{greetingBean.greetingMessage}" />
        </p>
    </h:form>
</h:body>
</html>
